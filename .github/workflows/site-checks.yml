name: Site safety checks

on:
  pull_request:
    paths:
      - "dist/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "package.json"
      - "content/journal/**"
      - "content/social/**"
      - "content/search-tools.json"
      - "search/**"
      - "studio/**"
      - "journal.css"
      - "journal.js"
      - ".github/workflows/site-checks.yml"
  push:
    branches:
      - main
    paths:
      - "dist/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "package.json"
      - "content/journal/**"
      - "content/social/**"
      - "content/search-tools.json"
      - "search/**"
      - "studio/**"
      - "journal.css"
      - "journal.js"
      - ".github/workflows/site-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate routes and deployment package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh static pre-rendering
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run prerender:preview
          else
            npm run prerender
          fi

      - name: Validate site structure and links
        run: npm run test:generated

      - name: Print external-link inventory
        run: npm run links

      - name: Validate the Cloudflare package
        run: npx wrangler deploy --dry-run --outdir /tmp/london-advanced-wrangler-check
