name: Site safety checks

on:
  pull_request:
    paths:
      - "dist/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "package.json"
      - "content/journal/**"
      - "studio/**"
      - "journal.css"
      - "journal.js"
      - ".github/workflows/site-checks.yml"
  push:
    branches:
      - main
    paths:
      - "dist/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "package.json"
      - "content/journal/**"
      - "studio/**"
      - "journal.css"
      - "journal.js"
      - ".github/workflows/site-checks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate routes and deployment package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh static pre-rendering
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run prerender:preview
          else
            npm run prerender
          fi

      - name: Reject stale generated pages in pull requests
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- dist/index.html dist/events/index.html dist/it dist/journal dist/studio dist/journal.css dist/journal.js dist/sitemap.xml; then
            echo "Generated pages/assets are stale. Run npm run prerender:preview and commit the generated output."
            git diff -- dist/index.html dist/events/index.html dist/it dist/journal dist/studio dist/journal.css dist/journal.js dist/sitemap.xml
            exit 1
          fi

      - name: Validate site structure and links
        run: npm test

      - name: Print external-link inventory
        run: npm run links

      - name: Validate the Cloudflare package
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/london-advanced-wrangler-check

      - name: Sync generated pages on main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dist/index.html dist/events/index.html dist/it dist/journal dist/studio dist/journal.css dist/journal.js dist/sitemap.xml; then
            echo "Generated pages/assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/events/index.html dist/it dist/journal dist/studio dist/journal.css dist/journal.js dist/sitemap.xml
          git commit -m "build: refresh generated bilingual pages and assets"
          git push
