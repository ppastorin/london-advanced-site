name: Canonical redirect diagnostic

on:
  push:
    branches:
      - codex/diagnose-canonical-redirect
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: Trace production redirect chains
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Trace canonical redirects
        run: node scripts/check-canonical-redirects.mjs
