name: Application endpoint health

on:
  schedule:
    - cron: "15 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/check-endpoints.mjs"
      - "scripts/check-canonical-redirects.mjs"
      - "dist/content.js"
      - ".github/workflows/endpoint-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check production endpoints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check canonical redirects
        id: canonical
        continue-on-error: true
        run: node scripts/check-canonical-redirects.mjs

      - name: Check application endpoints
        id: applications
        continue-on-error: true
        run: npm run health

      - name: Fail if any production check failed
        if: always()
        run: |
          if [ "${{ steps.canonical.outcome }}" != "success" ] || [ "${{ steps.applications.outcome }}" != "success" ]; then
            echo "One or more production health checks failed."
            echo "Canonical redirects: ${{ steps.canonical.outcome }}"
            echo "Application endpoints: ${{ steps.applications.outcome }}"
            exit 1
          fi
