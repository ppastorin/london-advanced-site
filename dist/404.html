<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — London Advanced</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .not-found div { max-width: 620px; }
    .not-found span { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .not-found h1 { margin: 18px 0; font: 400 clamp(54px, 10vw, 110px)/.9 var(--serif); }
    .not-found p { margin: 0 auto 28px; color: #5d5d5d; line-height: 1.6; }
  </style>
</head>
<body><main class="not-found"><div><span>Error 404</span><h1>This route went somewhere else.</h1><p>The page does not exist, but five practical London tools are waiting at the homepage.</p><a class="button dark" href="/">Return to London Advanced</a></div></main></body>
</html>
